title: Continuous Norming
name: continuous
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Raw Score Variable
        children:
          - type: VariablesListBox
            name: raw
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Explanatory / Grouping Variable (e.g., age)
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Weights (optional)
        children:
          - type: VariablesListBox
            name: weights
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: method
      - type: ComboBox
        name: scale
  - type: CollapseBox
    label: Model Parameters
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        margin: large
        children:
          - type: Label
            label: Distribution-Free (Taylor Polynomials)
            fitToGrid: true
            children:
              - type: CheckBox
                name: descend
                enable: (method:taylor)
              - type: TextBox
                name: nGroups
                format: number
                enable: (method:taylor)
              - type: CheckBox
                name: equidistant
                enable: (method:taylor)
              - type: ComboBox
                name: k
                enable: (method:taylor)
              - type: ComboBox
                name: t
                enable: (method:taylor)
              - type: RadioButton
                name: selectionType_automatic
                optionName: selectionType
                optionPart: automaticSelection
                enable: (method:taylor)
              - type: RadioButton
                name: selectionType_manual
                optionName: selectionType
                optionPart: manualSelection
                label: Manual number of terms
                enable: (method:taylor)
                children:
                  - type: TextBox
                    name: terms
                    format: number
                    enable: (method:taylor && selectionType:manualSelection)
          - type: Label
            label: Beta-Binomial Parameters
            fitToGrid: true
            children:
              - type: ComboBox
                name: alpha
                enable: (method:betabinomial)
              - type: ComboBox
                name: beta
                enable: (method:betabinomial)
              - type: TextBox
                name: itemnumber
                format: number
                enable: (method:betabinomial)
          - type: Label
            label: Sinh-Arcsinh (SHASH) Parameters
            fitToGrid: true
            children:
              - type: ComboBox
                name: muDegree
                enable: (method:shash)
              - type: ComboBox
                name: sigmaDegree
                enable: (method:shash)
              - type: ComboBox
                name: epsilonDegree
                enable: (method:shash)
              - type: ComboBox
                name: deltaDegree
                enable: (method:shash && !fixDelta)
              - type: CheckBox
                name: fixDelta
                enable: (method:shash)
              - type: TextBox
                name: deltaValue
                format: number
                enable: (method:shash && fixDelta)
          - type: Label
            label: Conway-Maxwell-Poisson (CMP) Parameters
            fitToGrid: true
            children:
              - type: ComboBox
                name: cmpMuDegree
                enable: (method:cmp)
              - type: ComboBox
                name: cmpNuDegree
                enable: (method:cmp && !cmpFixNu)
              - type: CheckBox
                name: cmpFixNu
                enable: (method:cmp)
              - type: TextBox
                name: cmpNuValue
                format: number
                enable: (method:cmp && cmpFixNu)
              - type: TextBox
                name: cmpMaxScore
                format: number
                enable: (method:cmp)
  - type: CollapseBox
    label: Output & Norm Table
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: model
          - type: Label
            label: Norm Score Table
            fitToGrid: true
            children:
              - type: TextBox
                name: normAge
                format: string
              - type: TextBox
                name: range
                format: number
              - type: TextBox
                name: minRaw
                format: number
              - type: TextBox
                name: maxRaw
                format: number
              - type: TextBox
                name: stepping
                format: number
                enable: (!method:betabinomial)
          - type: Label
            label: Confidence Intervals
            fitToGrid: true
            children:
              - type: CheckBox
                name: includeCI
              - type: TextBox
                name: ciLevel
                format: number
                enable: (includeCI)
              - type: TextBox
                name: reliability
                format: number
                enable: (includeCI)
  - type: CollapseBox
    label: Save
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: saveManifest
            enable: (method:taylor)
          - type: Output
            name: saveManifestPerc
            enable: (method:taylor)
          - type: Output
            name: savePredicted
          - type: Output
            name: savePredictedPerc