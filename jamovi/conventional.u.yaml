title: Single Group Norming
name: conventional
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Raw Score Variable
        children:
          - type: VariablesListBox
            name: raw
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Weights (optional)
        children:
          - type: VariablesListBox
            name: weights
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Parameters
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        margin: small
        children:
          - type: Label
            label: Data Preparation
            fitToGrid: true
            cell:
              column: 0
              row: 0
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: CheckBox
                    name: descend
                  - type: ComboBox
                    name: scale
          - type: Label
            label: Regression Smoothing
            fitToGrid: true
            cell:
              column: 0
              row: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: CheckBox
                    name: k
                  - type: ComboBox
                    name: kPower
                    enable: (k)
                  - type: RadioButton
                    name: selectionType_automatic
                    optionName: selectionType
                    optionPart: automaticSelection
                    enable: (k)
                  - type: RadioButton
                    name: selectionType_manual
                    optionName: selectionType
                    optionPart: manualSelection
                    label: Manual number of terms
                    enable: (k)
                    children:
                      - type: TextBox
                        name: terms
                        format: number
                        enable: (k && selectionType:manualSelection)
  - type: CollapseBox
    label: Output
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: small
        children:
          - type: Label
            label: Display
            fitToGrid: true
            cell:
              column: 0
              row: 0
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: plotting
                  - type: CheckBox
                    name: model
                    enable: (k)
          - type: Label
            label: Norm Score Table
            fitToGrid: true
            cell:
              column: 0
              row: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: range
                    format: number
                  - type: TextBox
                    name: minRaw
                    format: number
                    enable: (k)
                  - type: TextBox
                    name: maxRaw
                    format: number
                    enable: (k)
                  - type: TextBox
                    name: stepping
                    format: number
                    enable: (k)
          - type: Label
            label: Confidence Intervals
            fitToGrid: true
            cell:
              column: 0
              row: 2
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: CheckBox
                    name: includeCI
                  - type: TextBox
                    name: ciLevel
                    format: number
                    enable: (includeCI)
                  - type: TextBox
                    name: reliability
                    format: number
                    enable: (includeCI)
  - type: CollapseBox
    label: Save
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: saveManifest
          - type: Output
            name: saveManifestPerc
          - type: Output
            name: savePredicted
            enable: (k)
          - type: Output
            name: savePredictedPerc
            enable: (k)