---
name: continuous
title: Continuous Norming
menuGroup: cNORMj
version: '3.7.0'
jas: '1.2'
weightsSupport: full

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: raw
      title: Raw score variable
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: the raw score variable in the data

    - name: group
      title: Explanatory / grouping variable (e.g., age)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: the explanatory or age/grouping variable in the data

    - name: weights
      title: Weights (optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: an optional weighting variable specifying the weights of the single cases

    - name: method
      title: Modeling method
      type: List
      options:
        - name: taylor
          title: Distribution-Free (Taylor Polynomials)
        - name: betabinomial
          title: Beta-Binomial (Item Counts / IRT)
        - name: shash
          title: Sinh-Arcsinh (SHASH — Continuous)
        - name: cmp
          title: Conway-Maxwell-Poisson (CMP — Speeded / Counts)
      default: taylor

    - name: scale
      title: Norm scale
      type: List
      options:
        - T
        - IQ
        - z
        - Wechsler
        - PISA
      default: T
      description:
          R: >
            `'T'`, `'IQ'`, `'z'`, `'Wechsler'` (m = 10, sd = 3), or `'PISA'` (m = 500, sd = 100)

    # --- Taylor Polynomials Options ---
    - name: descend
      title: Invert ranking order (descending)
      type: Bool
      default: false

    - name: k
      title: Degree of location (k)
      type: List
      options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
      default: '5'

    - name: t
      title: Degree of explanatory variable (t)
      type: List
      options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
      default: '3'

    - name: selectionType
      title: Term selection
      type: List
      options:
        - name: automaticSelection
          title: Automatic
        - name: manualSelection
          title: Manual
      default: automaticSelection

    - name: terms
      title: Number of terms
      type: Integer
      min: 1
      max: 48
      default: 4

    # --- Beta-Binomial Options ---
    - name: alpha
      title: Degree of α (alpha)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '3'

    - name: beta
      title: Degree of β (beta)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '3'

    - name: itemnumber
      title: Number of items in test (0 = max observed)
      type: Integer
      min: 0
      default: 0

    # --- SHASH Options ---
    - name: muDegree
      title: Degree of μ (location)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '3'

    - name: sigmaDegree
      title: Degree of σ (scale)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '2'

    - name: epsilonDegree
      title: Degree of ε (skewness)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '2'

    - name: deltaDegree
      title: Degree of δ (tail weight)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '1'

    - name: fixDelta
      title: Fix tail weight δ to constant
      type: Bool
      default: false

    - name: deltaValue
      title: Fixed δ value
      type: Number
      min: 0.1
      max: 10.0
      default: 1.0

    # --- CMP Options ---
    - name: cmpMuDegree
      title: Degree of μ (location)
      type: List
      options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '3'

    - name: cmpNuDegree
      title: Degree of ν (dispersion)
      type: List
      options:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      default: '2'

    - name: cmpFixNu
      title: Fix dispersion ν (e.g., 1 = Poisson)
      type: Bool
      default: false

    - name: cmpNuValue
      title: Fixed ν value
      type: Number
      min: 0.05
      max: 20.0
      default: 1.0

    - name: cmpMaxScore
      title: Maximum score ceiling (0 = untruncated)
      type: Integer
      min: 0
      default: 0

    # --- Output & Norm Table Options ---
    - name: model
      title: Model summary
      type: Bool
      default: true

    - name: normAge
      title: Value for norm score table (e.g., age)
      type: String
      default: ''

    - name: range
      title: Norm score range (± SD)
      type: Number
      min: 0.5
      max: 6.0
      default: 3.0

    - name: minRaw
      title: Minimum raw score
      type: Number
      default: 0

    - name: maxRaw
      title: Maximum raw score (0 = auto)
      type: Number
      default: 0

    - name: stepping
      title: Step size
      type: Number
      min: 0.01
      default: 1

    - name: includeCI
      title: Include confidence intervals
      type: Bool
      default: false

    - name: ciLevel
      title: Confidence level
      type: Number
      min: 0.50
      max: 0.999
      default: 0.90

    - name: reliability
      title: Reliability coefficient
      type: Number
      min: 0.01
      max: 0.999
      default: 0.90

    # --- Save Outputs ---
    - name: saveManifest
      title: Manifest norm scores
      type: Output

    - name: saveManifestPerc
      title: Manifest percentile scores
      type: Output

    - name: savePredicted
      title: Fitted norm scores
      type: Output

    - name: savePredictedPerc
      title: Fitted percentile scores
      type: Output
...