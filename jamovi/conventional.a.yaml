---
name: conventional
title: Single Group Norming
menuGroup: cNORMj
version: '3.7.0'
jas: '1.2'
weightsSupport: full

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: raw
      title: Raw score variable
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: a string specifying the raw score variable in `data`

    - name: weights
      title: Weights (optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: an optional weighting variable specifying the weights of the single cases

    - name: scale
      title: Norm scale
      type: List
      options:
        - T
        - IQ
        - z
        - Wechsler
        - PISA
      default: T
      description:
          R: >
            `'T'`, `'IQ'`, `'z'`, `'Wechsler'` (m = 10, sd = 3), or `'PISA'` (m = 500, sd = 100)

    - name: descend
      title: Invert ranking order (descending)
      type: Bool
      default: false

    - name: k
      title: Smooth with polynomial regression
      type: Bool
      default: true

    - name: kPower
      title: Degree of location (k)
      type: List
      options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
      default: '5'

    - name: selectionType
      title: Term selection
      type: List
      options:
        - name: automaticSelection
          title: Automatic
        - name: manualSelection
          title: Manual
      default: automaticSelection

    - name: terms
      title: Number of terms
      type: Integer
      min: 1
      max: 6
      default: 4

    - name: plotting
      title: Result plot
      type: List
      options:
        - Norm Score
        - Percentile
      default: Norm Score

    - name: model
      title: Model summary
      type: Bool
      default: true

    - name: range
      title: Norm table range (± SD)
      type: Number
      min: 0.5
      max: 6.0
      default: 3.0

    - name: minRaw
      title: Minimum raw score
      type: Number
      default: 0

    - name: maxRaw
      title: Maximum raw score
      type: Number
      default: 0

    - name: stepping
      title: Step size
      type: Number
      min: 0.01
      default: 1

    - name: includeCI
      title: Include confidence intervals
      type: Bool
      default: false

    - name: ciLevel
      title: Confidence level
      type: Number
      min: 0.50
      max: 0.999
      default: 0.90

    - name: reliability
      title: Reliability coefficient
      type: Number
      min: 0.01
      max: 0.999
      default: 0.90

    - name: saveManifest
      title: Manifest norm scores
      type: Output

    - name: saveManifestPerc
      title: Manifest percentile scores
      type: Output

    - name: savePredicted
      title: Fitted norm scores
      type: Output

    - name: savePredictedPerc
      title: Fitted percentile scores
      type: Output
...